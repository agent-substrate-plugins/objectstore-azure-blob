# Publishes a release for a pushed v* tag: the multi-arch image on GHCR,
# signed keylessly with cosign, its SPDX SBOMs as cosign attestations, and a
# GitHub release with the digest-pinned install asset and the SBOMs. RELEASE.md
# documents the process and the verify commands, which pin this file's path as
# the signing identity.
name: release
on:
  push:
    tags:
    - 'v*'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Runs the repository's tests without the release job's OIDC token and
  # package write access.
  test:
    # Forks have no access to the org's GHCR namespace.
    if: github.repository == 'agent-substrate-plugins/objectstore-azure-blob'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
    # The tag becomes an image tag and a release name.
    - name: Check the tag
      run: |
        if [[ ! $VERSION =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::tag must be v<major>.<minor>.<patch>[-<pre-release>]"
          exit 1
        fi
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: false
    - name: verify
      run: make verify
    - name: test
      run: make test
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image, signatures and attestations to GHCR
      id-token: write # keyless cosign signing with the workflow's OIDC token
    env:
      KO_DOCKER_REPO: ghcr.io/agent-substrate-plugins/objectstore-azure-blob
      PLATFORMS: linux/amd64,linux/arm64
      VERSION: ${{ github.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        # A release builds from a clean module and build cache.
        cache: false
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.4
    # ko and cosign read the credentials docker login stores.
    - name: Log in to GHCR
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - name: Build and push the image
      id: build
      run: |
        mkdir -p _output/sbom
        ref=$(make -s build-image KO_FLAGS="--bare --tags=$VERSION --platform=$PLATFORMS --sbom-dir=_output/sbom --image-refs=_output/image-refs --image-label=org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY,org.opencontainers.image.revision=$GITHUB_SHA")
        if [[ ! $ref =~ ^"$KO_DOCKER_REPO:$VERSION"@(sha256:[0-9a-f]{64})$ ]]; then
          echo "::error::unexpected image reference from ko: $ref"
          exit 1
        fi
        echo "digest=${BASH_REMATCH[1]}" >>"$GITHUB_OUTPUT"
    # --recursive signs the index and each platform image.
    - name: Sign the image
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: cosign sign --yes --recursive "$KO_DOCKER_REPO@$DIGEST"
    # ko writes one SPDX document per platform image plus one for the index,
    # each named sbom-<digest of the image it describes>.
    - name: Attest the SBOMs
      run: |
        IFS=, read -ra platforms <<<"$PLATFORMS"
        sboms=(_output/sbom/*.spdx.json)
        if [[ ${#sboms[@]} -ne $((${#platforms[@]} + 1)) ]]; then
          echo "::error::want $((${#platforms[@]} + 1)) SBOMs, ko wrote: ${sboms[*]}"
          exit 1
        fi
        for sbom in "${sboms[@]}"; do
          subject=$(jq -r '.name | sub("^sbom-"; "")' "$sbom")
          if ! grep -qxF "$KO_DOCKER_REPO@$subject" _output/image-refs; then
            echo "::error::$sbom describes $subject, which this build did not publish"
            exit 1
          fi
          cosign attest --yes --type spdxjson --predicate "$sbom" "$KO_DOCKER_REPO@$subject"
        done
    - name: Render the install asset
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: make install-asset IMAGE="$KO_DOCKER_REPO@$DIGEST"
    - name: Create the release
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        ./hack/release-notes.sh "$KO_DOCKER_REPO@$DIGEST" "$VERSION" "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" >_output/release-notes.md
        args=(--verify-tag --title "$VERSION" --notes-file _output/release-notes.md --generate-notes)
        if [[ $VERSION == *-* ]]; then
          args+=(--prerelease)
        fi
        gh release create "$VERSION" "${args[@]}" \
          _output/objectstore-azure-blob-component.yaml \
          _output/sbom/*.spdx.json
