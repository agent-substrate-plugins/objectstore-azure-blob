# Substrate's nonroot base image, pinned by multi-platform index digest:
# ate-api-server's objectstore-plugin sidecar sets runAsNonRoot. Set
# KO_DEFAULTPLATFORMS to override the platforms, e.g. host-only for kind.
defaultBaseImage: gcr.io/distroless/static-debian13:nonroot@sha256:18f4cc26c9ffa7f20a359298be7deadac5c607c8e03a02b8119f1a5fc2f82c99

defaultPlatforms:
  - linux/amd64
  - linux/arm64
